<style>
/* ==================================================================== */
/*  NOON AFTER DARK — tokens lifted from the Consumer Product Update deck */
/* ==================================================================== */
:root{
  --y:#FEEE00; --ink:#101114; --bg:#0B0C10; --bg2:#101218;
  --tx:#F4F5F7; --tx2:rgba(244,245,247,.72); --tx3:rgba(244,245,247,.48);
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.07);
  --ln:rgba(255,255,255,.10); --ln2:rgba(255,255,255,.16);
  --live:#57D9A3; --part:#5BC8DB; --prog:#5BC8DB; --soon:#FFC44D; --tbd:rgba(244,245,247,.4);
  --coral:#F2766B; --gold:#D8A93E;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --round:"Arial Rounded MT Bold","Helvetica Neue",Helvetica,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --bot:54px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{margin:0;color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1,h2,h3,h4,p{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none!important}
::selection{background:rgba(254,238,0,.3);color:#fff}
*{scrollbar-color:rgba(255,255,255,.18) transparent}
input{color:var(--tx)} input::placeholder{color:var(--tx3)}

/* ---- ambient glow, tinted per section ---- */
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.9;transition:background 1s ease}
.app[data-sec="cover"] .glow{background:
  radial-gradient(58% 52% at 82% 12%,rgba(254,238,0,.075),transparent 60%),
  radial-gradient(50% 55% at 10% 92%,rgba(94,141,239,.06),transparent 60%)}
.app[data-sec="metrics"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(91,141,239,.10),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="matrix"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(182,120,224,.09),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="journey"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(87,217,163,.09),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="insights"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(242,118,107,.09),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.grid-tex{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask-image:radial-gradient(120% 95% at 20% 8%,#000,transparent 80%);
  mask-image:radial-gradient(120% 95% at 20% 8%,#000,transparent 80%)}

/* ---- shared dark type ---- */
.d-kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--y)}
.d-title{font-size:clamp(28px,3.6vw,50px);font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--tx)}
.d-sub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--tx3)}
.k{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  padding:4px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.k-live{background:rgba(87,217,163,.14);color:var(--live)}
.k-soon{background:rgba(255,196,77,.13);color:var(--soon)}
.k-part{background:rgba(91,200,219,.13);color:var(--part)}
.k-tbd{background:rgba(255,255,255,.08);color:var(--tbd)}
.k-major{background:var(--y);color:var(--ink);font-weight:800}
.sq2{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;background:rgba(255,255,255,.1);color:var(--tx2);padding:2.5px 7px;border-radius:5px}
.ykey{display:inline-block;width:34px;height:6px;border-radius:3px;background:var(--y)}

/* ==================================================================== */
/*  SHELL                                                              */
/* ==================================================================== */
.app{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.spacer{flex:1}

.jtoggle button{padding:5px 12px;border-radius:99px;font-family:var(--mono);font-size:9.5px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--ln2);background:transparent;transition:.15s;white-space:nowrap}
.jtoggle button:hover{color:var(--tx);border-color:var(--tx3)}
.jtoggle button.on{background:var(--y);border-color:var(--y);color:var(--ink);font-weight:800}
.secdrop{position:relative;flex:none}
.secdrop-btn{display:flex;align-items:center;gap:9px;height:32px;padding:0 13px;
  border-radius:99px;border:1px solid var(--ln2);background:rgba(255,255,255,.04);
  font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--y);transition:.15s;min-width:172px;justify-content:space-between}
.secdrop-btn:hover{border-color:var(--y)}
.secdrop-btn svg{transition:transform .2s;opacity:.7;flex:none}
.secdrop.open .secdrop-btn{border-color:var(--y);background:rgba(254,238,0,.1)}
.secdrop.open .secdrop-btn svg{transform:rotate(180deg)}
.secdrop-list{position:absolute;bottom:calc(100% + 11px);right:0;min-width:236px;margin:0;padding:6px;
  list-style:none;border-radius:14px;border:1px solid var(--ln2);
  background:rgba(16,17,20,.96);backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 -22px 50px rgba(0,0,0,.65);z-index:60;
  opacity:0;visibility:hidden;transform:translateY(6px);transition:.18s}
.secdrop.open .secdrop-list{opacity:1;visibility:visible;transform:none}
.secdrop-list li{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx2);padding:9px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:10px}
.secdrop-list li:hover{background:rgba(255,255,255,.07);color:var(--tx)}
.secdrop-list li[aria-selected="true"]{background:rgba(254,238,0,.12);color:var(--y);font-weight:700}
.secdrop-list li .n{opacity:.5;font-size:9.5px;min-width:16px}


.stage{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;z-index:5}
.railwrap{flex:1;min-height:0;position:relative}
.jbar{flex:none;display:flex;align-items:center;gap:14px;
  padding:11px clamp(22px,3.4vw,52px);border-bottom:1px solid var(--ln);
  background:rgba(255,255,255,.02)}
/* the status filter sits on its own slim row beneath the view toggle, so the
   top bar keeps room for the marketplace chips */
.stbar{flex:none;display:flex;justify-content:flex-end;
  padding:8px clamp(22px,3.4vw,52px);border-bottom:1px solid var(--ln)}
.stbar.hidden{display:none}
.stsw{flex:none;display:flex;align-items:center;gap:5px}
.stsw .lbl{flex:none;font-family:var(--mono);font-size:8px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);margin-right:3px}
.stsw .stchip{height:24px;padding:0 9px 0 7px;gap:5px;border-radius:99px}
.stsw .stchip i{width:7px;height:7px;border-radius:50%}
.stsw .stchip .nm{font-size:10px}
.stsw .stchip .n{font-size:8px}
.srcsw{display:flex;align-items:center;gap:6px;flex:1;min-width:0;
  overflow-x:auto;scrollbar-width:none}
.srcsw::-webkit-scrollbar{display:none}
.srcsw .lbl{flex:none;font-family:var(--mono);font-size:8.5px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);padding-right:4px}
.srcchip{flex:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 11px 0 6px;
  border-radius:99px;border:1px solid var(--ln);background:rgba(255,255,255,.03);
  transition:.16s;white-space:nowrap;color:var(--tx3)}
.srcchip:hover{border-color:var(--tx3);color:var(--tx)}
.srcchip img{width:20px;height:20px;border-radius:5px;object-fit:contain;flex:none}
.srcchip i{width:20px;height:20px;border-radius:5px;flex:none}
.srcchip .nm{font-size:11.5px;font-weight:700;letter-spacing:-.01em}
.srcchip .n{font-family:var(--mono);font-size:9px;opacity:.6}
.srcchip.on{background:rgba(254,238,0,.13);border-color:rgba(254,238,0,.4);color:var(--tx)}
.srcchip.zero{opacity:.34}
.srcchip.all{padding-left:12px}
.srcchip.all .nm{letter-spacing:.1em;font-family:var(--mono);font-size:10px;text-transform:uppercase}
.jtoggle{flex:none;display:flex;gap:5px}
.rail{position:absolute;inset:0;display:flex;align-items:stretch;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.rail.grabbing{scroll-behavior:auto;cursor:grabbing}
.panel{flex:none;width:100%;height:100%;scroll-snap-align:start;overflow:hidden;
  display:flex;flex-direction:column;background:transparent;position:relative}
.pad{padding:20px clamp(22px,3.4vw,52px)}
@media (max-width:760px){ .pad{padding:14px 16px} }

/* ---- a note pinned over a slide: who still owes it content ---- */
.sticky{position:absolute;right:clamp(22px,3.4vw,52px);bottom:18px;z-index:20;
  width:188px;padding:13px 14px;background:var(--y);color:var(--ink);
  border-radius:2px;transform:rotate(-2.2deg);transform-origin:100% 100%;
  box-shadow:0 14px 30px rgba(0,0,0,.5);font-family:var(--mono);font-size:11px;
  line-height:1.45;letter-spacing:.01em}
.sticky b{display:block;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  opacity:.55;margin-bottom:5px}

/* ==================================================================== */
/*  BOTTOM BAR                                                         */
/* ==================================================================== */
.botbar{flex:none;height:var(--bot);border-top:1px solid var(--ln);
  background:rgba(11,12,16,.78);backdrop-filter:blur(18px);
  display:flex;align-items:center;gap:12px;padding:0 20px;z-index:20}
.navbtn{width:32px;height:32px;border-radius:99px;border:1px solid var(--ln);
  background:rgba(255,255,255,.04);color:var(--tx);display:grid;place-items:center;
  transition:.15s;flex:none}
.navbtn:hover{background:var(--y);color:var(--ink);border-color:var(--y)}
.navbtn[disabled]{opacity:.28;cursor:default}
.navbtn[disabled]:hover{background:rgba(255,255,255,.04);color:var(--tx);border-color:var(--ln)}
.posind{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--tx3);
  flex:none;min-width:60px;text-align:center}
.botspacer{flex:1}
.sitemaplink{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx3);text-decoration:none;border:1px solid var(--ln);
  border-radius:99px;padding:7px 12px;transition:.15s}
.sitemaplink:hover{border-color:var(--y);color:var(--y)}

/* focus strip — segmented rail, the only progress in the deck */
.jstrip{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.jstrip::-webkit-scrollbar{display:none}
.jpill{flex:none;display:flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:99px;
  border:1px solid var(--ln);font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tx3);background:rgba(255,255,255,.03);
  transition:.22s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.jpill:hover{color:var(--tx);border-color:var(--tx3)}
.jpill .e{font-size:11px;line-height:1}
.jpill .pn{opacity:.7;letter-spacing:.04em}
.jpill.on{background:rgba(254,238,0,.12);border-color:rgba(254,238,0,.34);color:var(--y);padding-right:12px}
.jpill .prog{display:none}
.jpill.on .prog{display:block;width:48px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.jpill.on .prog i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--y);transition:width .35s ease}

/* ==================================================================== */
/*  COVER — dark bento                                                 */
/* ==================================================================== */
/* The artwork carries its own empty quarter, so it is anchored to the right
   edge and allowed to run large — its blank corner overlaps the text column
   harmlessly while the cards themselves stay clear of the type. */
.cover{justify-content:center;position:relative;overflow:hidden}
.cover-in{position:relative;z-index:2;width:100%;
  padding:0 clamp(26px,5vw,72px);max-width:min(62%,880px)}
/* the artwork keeps clear air above and below it rather than running the
   full height of the slide */
/* the art clears the right edge by the same margin the text keeps on the left */
.cover-art{position:absolute;right:clamp(26px,5vw,72px);top:50%;
  transform:translateY(-50%);
  max-height:74%;max-width:50%;width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 30px 60px rgba(0,0,0,.55));z-index:1;pointer-events:none}
@media (max-width:900px){ .cover-art{display:none} .cover-in{max-width:100%} }
.cover .t-top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:clamp(18px,3vh,34px)}
.t-pill{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#fff;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:99px;
  padding:7px 14px;backdrop-filter:blur(12px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.t-pill .dotmark{width:7px;height:7px;border-radius:99px;background:var(--y)}
.cover h1{font-family:var(--sans);font-weight:900;font-size:clamp(38px,6.2vw,92px);
  line-height:.92;letter-spacing:-.04em;color:#fff}
.cover h1 em{font-style:normal;color:var(--y)}
.cover .lead{font-size:clamp(15px,1.5vw,21px);line-height:1.5;color:rgba(255,255,255,.82);
  max-width:74ch;margin-top:clamp(18px,3vh,30px);font-weight:500}
.cover .sub{font-size:clamp(13px,1.25vw,16.5px);line-height:1.55;margin-top:14px;
  max-width:78ch;color:var(--tx3)}
.cover .titlebar{background:var(--y);color:var(--ink);display:inline-block;padding:11px 24px;
  border-radius:99px;font-weight:800;letter-spacing:.11em;font-size:clamp(11px,1.15vw,15px);
  margin-top:clamp(18px,2.8vh,32px);text-transform:uppercase;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.mp-ribbon{position:absolute;right:0;top:0;bottom:0;width:min(33vw,352px);
  display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,1fr);
  place-items:center;
  gap:clamp(9px,1.05vw,15px);                 /* one value → equal in both axes */
  padding:clamp(16px,2.2vw,28px);
  pointer-events:none;z-index:1}
/* square, sized off the row height so five rows fill the slide,
   with max-width as the guard on narrow/short viewports */
.mp-ribbon i{height:100%;aspect-ratio:1;max-width:100%;max-height:100%}
.mp-ribbon i{border-radius:14px;border:1px solid rgba(255,255,255,.14);
  box-shadow:0 20px 40px rgba(0,0,0,.5)}
@media (max-width:1000px){ .mp-ribbon{display:none} }

/* ==================================================================== */
/*  SLIDE HEAD                                                         */
/* ==================================================================== */
.shead{flex:none;display:flex;align-items:flex-start;gap:16px;
  padding-bottom:clamp(12px,1.8vh,20px)}
/* a thin yellow rule anchors the title block now that the slide numbers
   are gone, and carries the eye down to the subtitle */
.shead .stack{position:relative;display:flex;flex-direction:column;gap:10px;
  min-width:0;padding-left:clamp(13px,1.1vw,18px)}
.shead .stack::before{content:"";position:absolute;left:0;top:3px;bottom:3px;
  width:3px;border-radius:99px;background:var(--y)}

/* the phase/date sits above the title — sized to read as its own line, not
   a small-print label */
.shead .shk{font-family:var(--mono);font-size:clamp(14px,1.5vw,19px);font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--y);opacity:.9}
.shead h2{font-size:clamp(23px,2.8vw,40px);font-weight:800;letter-spacing:-.035em;
  line-height:1;color:var(--tx)}
/* the subtitle is a sentence, not a label — it reads as sans text rather than
   the mono the deck uses for chips and captions */
.shead .tl{font-family:var(--sans);font-size:clamp(13.5px,1.25vw,18px);font-weight:500;
  letter-spacing:-.005em;line-height:1.35;color:rgba(244,245,247,.60);max-width:74ch}
.shead .ct{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  color:var(--tx3);white-space:nowrap}
.seg{display:flex;gap:5px;flex:none}
.segb{padding:5px 12px;border-radius:99px;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);
  border:1px solid var(--ln2);transition:.15s}
.segb:hover{color:var(--tx);border-color:var(--tx3)}
.segb.on{background:var(--y);border-color:var(--y);color:var(--ink);font-weight:800}
.dummy-tag{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--soon);background:rgba(255,196,77,.13);
  padding:4px 9px;border-radius:99px;flex:none}

.st{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  padding:4px 10px;border-radius:99px;white-space:nowrap;font-weight:700;text-transform:uppercase}
.st.live{background:rgba(87,217,163,.14);color:var(--live)}
.st.prog{background:rgba(91,200,219,.13);color:var(--part)}
.st.opp{background:rgba(255,196,77,.13);color:var(--soon)}
.ilabel{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  padding:4px 10px;border-radius:99px;white-space:nowrap;font-weight:700;text-transform:uppercase}
.ilabel.gm{background:rgba(255,255,255,.08);color:var(--tbd)}
.ilabel.cx{background:rgba(91,200,219,.13);color:var(--part)}


.lightbox{position:fixed;inset:0;z-index:9000;display:none;place-items:center;
  background:rgba(6,7,9,.93);backdrop-filter:blur(6px);cursor:zoom-out;padding:34px}
.lightbox.on{display:grid}
.lightbox img,.lightbox video{max-width:min(94vw,1200px);max-height:92vh;width:auto;height:auto;
  border-radius:22px;display:block;box-shadow:0 30px 90px rgba(0,0,0,.7);
  border:1px solid rgba(255,255,255,.12)}
.lbclose{position:absolute;top:20px;right:24px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--ln2);background:rgba(255,255,255,.05);color:var(--tx2);cursor:pointer;
  display:grid;place-items:center;transition:.15s}
.lbclose:hover{border-color:var(--y);color:var(--y)}
.lbcap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--tx3)}

/* ==================================================================== */

/* ==================================================================== */
/*  INSIGHTS                                                           */
/* ==================================================================== */
.ins{flex:1;min-height:0;overflow:auto;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:13px;align-content:start}
.icard{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:20px 18px}
.icard .n{font-family:var(--mono);font-size:18px;font-weight:800;background:var(--y);
  color:var(--ink);border-radius:8px;padding:2px 9px;display:inline-block}
.icard h3{font-size:15.5px;font-weight:800;margin:14px 0 8px;letter-spacing:-.01em;color:var(--tx)}
.icard p{font-size:12px;line-height:1.55;color:var(--tx3)}

/* ==================================================================== */
/*  DECK-SPECIFIC — card revamp                                         */
/* ==================================================================== */
/* the glow tints per section, same trick as the interop deck */
.app[data-sec="fresh"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(91,141,239,.10),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="web"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(91,200,219,.10),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="functional"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(182,120,224,.09),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="performance"] .glow{background:
  radial-gradient(58% 55% at 85% 10%,rgba(87,217,163,.10),transparent 62%),
  radial-gradient(45% 50% at 8% 95%,rgba(254,238,0,.05),transparent 55%)}
.app[data-sec="end"] .glow{background:
  radial-gradient(58% 52% at 50% 50%,rgba(254,238,0,.085),transparent 62%)}

/* every content slide is a head plus one flexible body */
.col{flex:1;min-height:0;display:flex;flex-direction:column}
.shead .rt{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ---- empty placeholder, used wherever real content has not landed ---- */
.ph{border:1.5px dashed var(--ln2);border-radius:16px;background:rgba(255,255,255,.025);
  display:grid;place-items:center;text-align:center;padding:14px;gap:6px;align-content:center}
.ph .t{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx3)}
.ph .h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:rgba(244,245,247,.28)}

/* ==================================================================== */
/*  SCREEN ROW                                                          */
/* ==================================================================== */
/* a row of screens is width-limited, so keep the gaps tight and let the row
   run a little past the slide padding — that buys real pixels per screen */
.screens{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;
  gap:clamp(8px,1vw,18px);margin-inline:calc(-1 * clamp(8px,1.2vw,22px))}
/* equal cells keep every screen — and an empty slot waiting on an asset —
   the same width, so the row reads as one set */
.screens .shot{flex:1 1 0;min-width:0}
/* the recording takes all the height the slide has; the stills step down
   just enough to keep it leading */
.screens .shot.sm{--scale:.86}
.screens .shot.vid{--scale:1}
.screens .fr.empty{justify-self:stretch;width:100%;height:auto;align-self:end}
@media (max-width:900px){ .screens{overflow-x:auto;justify-content:flex-start} }

/* ==================================================================== */
/*  BEFORE / AFTER                                                      */
/* ==================================================================== */
.ba{flex:1;min-height:0;display:flex;gap:clamp(12px,1.6vw,30px);align-items:stretch}
@media (max-width:900px){ .ba{overflow-x:auto} }
/* no card and no divider around a pair — the highlight box at the top of
   each column is what separates the four groups */
.bapair{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
/* a wrapping highlight must not sit lower than its neighbours, so every
   box holds the same height whether its line wraps or not */
.keybox{order:4;flex:none;display:flex;align-items:center;gap:9px;
  min-height:clamp(48px,6.4vh,60px);
  margin-top:11px;padding:10px 13px;border-radius:13px;
  background:var(--card);border:1px solid var(--ln)}
.keybox i{flex:none;display:grid;place-items:center;width:18px;height:18px;
  border-radius:50%;background:var(--y);color:var(--ink);margin-top:1px}
.keybox span{font-size:clamp(11.5px,.95vw,13.5px);font-weight:600;line-height:1.35;
  letter-spacing:-.005em;color:var(--tx2)}
/* the title sits under its pair rather than floating at the top of the
   slide — screens, their before/after tags, then the moment they show */
.bapair .lbl{order:3;display:flex;align-items:baseline;gap:9px;flex:none;
  justify-content:center;margin-top:11px}
.bapair .lbl h3{font-size:clamp(13px,1.15vw,16.5px);font-weight:800;
  letter-spacing:-.015em;color:var(--tx)}
.bapair .lbl span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx3)}
.bashots{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;justify-content:center;
  gap:clamp(6px,.8vw,14px);order:1}
.bashots .shot{flex:1 1 0;min-width:0}
.bashots .shot.after{flex-grow:1.3}
/* the old screen is the reference point, so it sits smaller and quieter
   than the new one beside it */
.ba .shot.before{--scale:.78}
.ba .shot.before .fr{opacity:.45}
.ba .shot.before .cap{opacity:.55}
/* CSS alone cannot fit a screen to both the room above it and the room
   beside it without either cropping it or letterboxing it inside a border,
   so fitShots() measures each cell and sizes the frame in pixels from the
   asset's own proportions. --scale is how much of the available height a
   given screen may take. */
.shot{--scale:1;height:100%;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;gap:7px}
/* corner-shape rounds the way a device does — a squircle rather than a
   plain arc — and a browser without it falls back to the same radius,
   which fitShots() sets in proportion to how wide the screen is drawn */
.shot .fr{flex:none;max-width:100%;overflow:hidden;display:grid;place-items:center;
  corner-shape:squircle;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.shot .fr img,.shot .fr video{width:100%;height:100%;object-fit:contain;
  display:block;cursor:zoom-in;corner-shape:squircle}
/* a frame still waiting on its asset keeps the shape of a phone screen */
.shot .fr.empty{border:1.5px dashed var(--ln2);
  background:rgba(255,255,255,.03);box-shadow:none}
.shot .cap{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--tx3);text-align:center;line-height:1.3}
.shot.before .cap{color:var(--tx3)}
.shot.after .cap{color:var(--y)}
.shot.after .fr.empty{border-color:rgba(254,238,0,.34)}
.banote{flex:none;margin-top:11px;font-size:11.5px;line-height:1.5;color:var(--tx3)}

/* ==================================================================== */
/*  STACK — small slots down the left, one large screen on the right    */
/* ==================================================================== */
.stackrow{flex:1;min-height:0;display:flex;align-items:stretch;
  gap:clamp(14px,2vw,34px)}
.flowcol{min-height:0;display:flex;flex-direction:column;gap:9px}
.flowcol.old{flex:0 0 clamp(170px,16vw,250px)}
/* the rule is what separates the two flows */
.flowcol.new{flex:1 1 auto;min-width:0;border-left:1px solid var(--ln);
  padding-left:clamp(14px,2vw,34px)}
.flowlbl{flex:none;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
.flowlbl.on{color:var(--y)}
.stackcol{flex:1;min-height:0;min-width:0;display:flex;
  flex-direction:column;gap:clamp(6px,1.1vh,14px)}
.stackcol .shot{flex:1 1 0;min-height:0;justify-content:center}
.flowcol.new .shot.hero{flex:1 1 auto;min-height:0;justify-content:center}
/* the recording steps back a little from the full height */
.shot.hero{--scale:.88}
@media (max-width:900px){ .stackrow{flex-direction:column}
  .flowcol.new{border-left:0;padding-left:0;border-top:1px solid var(--ln);padding-top:14px} }

/* ==================================================================== */
/*  SPLIT — a single frame beside a list of points                      */
/* ==================================================================== */
.split{flex:1;min-height:0;display:grid;grid-template-columns:1.25fr .85fr;
  gap:clamp(12px,1.4vw,22px)}
@media (max-width:1000px){ .split{grid-template-columns:1fr;overflow-y:auto} }
.splitmedia{min-height:0;display:grid;grid-template-rows:minmax(0,1fr);gap:9px;
  justify-items:center;background:var(--card);border:1px solid var(--ln);
  border-radius:22px;padding:16px}
/* a web screen is width-led — it takes the column and keeps 16:10; a phone
   screen is height-led, so it takes the slide height and keeps 9:19.5 */
.splitmedia .fr{max-width:100%;max-height:100%;align-self:center;
  display:grid;place-items:center}
.splitmedia .fr img,.splitmedia .fr video{border-radius:16px;corner-shape:squircle;
  box-shadow:0 18px 44px rgba(0,0,0,.45)}
.splitmedia .fr.empty{width:100%;height:100%;overflow:hidden;border-radius:20px;
  border:1.5px dashed var(--ln2);background:rgba(255,255,255,.03)}
.splitmedia.phone .fr.empty{width:auto;aspect-ratio:9/19.5}
/* while it is still a placeholder the card frame around it is redundant */
.splitmedia:has(.fr.empty){border:0;background:none;padding:0}
.splitmedia.free .fr{aspect-ratio:auto;width:100%}
.splitmedia .fr img,.splitmedia .fr video{max-width:100%;max-height:100%;
  width:auto;height:auto;cursor:zoom-in}
.splitmedia .cap{font-family:var(--mono);font-size:8.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.pts{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;align-content:start}
.pt{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start}
.pt .d{flex:none;width:7px;height:7px;border-radius:99px;background:var(--y);margin-top:6px}
.pt h4{font-size:13.5px;font-weight:800;letter-spacing:-.01em;color:var(--tx);margin:0 0 5px}
.pt p{font-size:11.5px;line-height:1.55;color:var(--tx3);margin:0}

/* ==================================================================== */
/*  METRICS                                                             */
/* ==================================================================== */
.mwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.2vw,16px)}
.mgrid{flex:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:clamp(9px,1vw,14px)}
.mtile{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:16px 18px}
.mtile .k{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--tx3)}
.mtile .v{font-family:var(--mono);font-size:clamp(24px,2.5vw,34px);font-weight:800;
  letter-spacing:-.04em;line-height:1;margin-top:10px;color:var(--y)}
.mtile .v.ph-v{color:rgba(244,245,247,.22)}
/* the label reads under the number it belongs to */
.mtile .lab{margin-top:9px;font-family:var(--mono);font-size:9.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--tx2)}
.mtile .dl{margin-top:7px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--tx3)}
.mtile .dl.up{color:var(--live)} .mtile .dl.down{color:var(--coral)}
.mbox{flex:1;min-height:0;background:var(--card);border:1px solid var(--ln);border-radius:20px;
  padding:16px 18px;display:flex;flex-direction:column}
.mbox .bt{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx2);display:flex;align-items:center;gap:10px}
.mbox .bt b{margin-left:auto;font-weight:700;color:var(--tx3);letter-spacing:.1em}
.mbox .body{flex:1;min-height:0;margin-top:12px;display:flex}
.mbox .body > *{flex:1;min-height:0}

/* ==================================================================== */
/*  GMV CHART                                                          */
/* ==================================================================== */
.chwrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.2vw,16px)}
.chplot{flex:1;min-height:0;background:var(--card);border:1px solid var(--ln);
  border-radius:20px;padding:15px 18px 10px;display:flex;flex-direction:column}
.chplot svg{flex:1;min-height:0;width:100%;overflow:visible}
.chplot .bar{fill:var(--y);opacity:.85}
.chplot .bar.pre{fill:rgba(244,245,247,.30)}
.chplot .bar.hot{fill:var(--coral)} .chplot .bar.warm{fill:var(--gold)}
.chplot .bar.good{fill:var(--live)}
.chplot .grid{stroke:rgba(255,255,255,.07);stroke-width:1}
.chplot .zero{stroke:rgba(255,255,255,.18)}
.chplot .ylab,.chplot .xlab{font-family:var(--mono);font-size:9px;fill:var(--tx3);letter-spacing:.06em}
.chplot .ylab{text-anchor:end} .chplot .xlab{text-anchor:middle}
.chplot .bandbox.red{fill:rgba(242,118,107,.13);stroke:rgba(242,118,107,.42)}
.chplot .bandbox.green{fill:rgba(87,217,163,.12);stroke:rgba(87,217,163,.42)}
.chplot .bandbox.gold{fill:rgba(216,169,62,.14);stroke:rgba(216,169,62,.48)}
.chplot .bandlab{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;text-anchor:middle}
.chplot .bandlab.red{fill:var(--coral)} .chplot .bandlab.green{fill:var(--live)}
.chplot .bandlab.gold{fill:var(--gold)}
.chplot .peak{font-family:var(--mono);font-size:9px;fill:var(--tx2);text-anchor:middle}
.chcap{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
.chcap i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;
  vertical-align:-1px}
.chcap .red i{background:rgba(242,118,107,.45);outline:1px solid rgba(242,118,107,.6)}
.chcap .green i{background:rgba(87,217,163,.45);outline:1px solid rgba(87,217,163,.6)}
.chcap .gold i{background:rgba(216,169,62,.45);outline:1px solid rgba(216,169,62,.6)}
.chcap .line i{background:none;border-top:2px solid var(--coral);height:0;border-radius:0}

/* ---- a second series on its own right-hand axis ---- */
.chplot .ln{fill:none;stroke:var(--coral);stroke-width:2.2;stroke-linejoin:round}
.chplot .lndot{fill:var(--coral)}
.chplot .ylab.r{text-anchor:start;fill:rgba(242,118,107,.75)}

/* ---- a run-rate reference drawn across the months it covers ---- */
.chplot .base{stroke:var(--y);stroke-width:1.6;stroke-dasharray:5 4;opacity:.75}
/* the label sits over its own bars, so it carries a dark outline to stay read */
.chplot .baselab{font-family:var(--mono);font-size:9.5px;font-weight:700;fill:var(--y);
  text-anchor:start;paint-order:stroke;stroke:var(--bg);stroke-width:3.5;stroke-linejoin:round}

/* ---- chart beside a funnel, when one slide has to carry both ---- */
.chrow{flex:1;min-height:0;display:flex;gap:clamp(10px,1.2vw,16px)}
.chrow .chplot{flex:1;min-width:0}
.chfn{flex:none;width:clamp(200px,25%,290px);background:var(--card);border:1px solid var(--ln);
  border-radius:20px;padding:15px 18px;display:flex;flex-direction:column}
.chfn .bt{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--tx2)}
.chfn .rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:9px;
  margin-top:12px}
.chfn .row{display:grid;grid-template-columns:1fr;gap:4px}
.chfn .row .lb{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.06em;color:var(--tx2)}
.chfn .row .lb b{margin-left:auto;font-size:11px;color:var(--live)}
.chfn .row.flat .lb b{color:var(--tx3)}
.chfn .row .tr{height:7px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.chfn .row .fl{height:100%;border-radius:99px;background:var(--live);opacity:.85}

/* ==================================================================== */
/*  COLUMNS — three standing boxes                                      */
/* ==================================================================== */
/* the boxes match each other's height and their headings line up */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(12px,1.5vw,24px)}
@media (max-width:900px){ .cols{grid-template-columns:1fr;overflow-y:auto} }
/* the screen sits flush against the foot of the box, so the card is padded
   on three sides only and clips whatever runs to its edge */
.colbox{min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--card);border:1px solid var(--ln);border-radius:22px;
  corner-shape:squircle;
  padding:clamp(18px,1.9vw,30px) clamp(16px,1.7vw,26px) 0}
.colicon{flex:none;display:grid;place-items:center;width:42px;height:42px;
  border-radius:13px;corner-shape:squircle;
  background:rgba(254,238,0,.12);color:var(--y);
  box-shadow:inset 0 0 0 1px rgba(254,238,0,.22)}
.colbox h3{margin:clamp(14px,1.8vh,20px) 0 clamp(12px,1.6vh,18px);
  font-size:clamp(15px,1.35vw,20px);font-weight:800;letter-spacing:-.02em;
  line-height:1.2;color:var(--tx)}
/* the points keep their full height — the screen below takes what is left,
   rather than the list being squeezed and scrolling */
.colpts{flex:none;margin:0;padding:0;list-style:none;display:flex;
  flex-direction:column;gap:clamp(9px,1.3vh,15px)}
.colpts li{display:flex;gap:11px;align-items:flex-start}
.colpts li i{flex:none;width:6px;height:6px;border-radius:50%;
  background:var(--y);margin-top:.5em}
.colpts li span{font-size:clamp(12px,1.02vw,14.5px);line-height:1.5;
  color:var(--tx2);letter-spacing:-.003em}
/* the screen sits under the points and takes whatever room is left */
.colshot{flex:1 1 auto;min-height:0;margin-top:clamp(12px,1.8vh,20px)}
.colshot .fr,.colshot .fr img,.colshot .fr video{box-shadow:none;corner-shape:squircle}
.colshot .fr.empty{width:100%;height:100%;aspect-ratio:auto}

/* ==================================================================== */
/*  CARD GRID (functional optimisations)                                */
/* ==================================================================== */
.cgrid{flex:1;min-height:0;overflow:auto;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:13px;align-content:start}
.ccard{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:18px;
  transition:.2s;display:flex;flex-direction:column}
.ccard:hover{border-color:var(--ln2);background:var(--card2)}
.ccard .n{font-family:var(--mono);font-size:16px;font-weight:800;background:var(--y);
  color:var(--ink);border-radius:8px;padding:2px 9px;display:inline-block;align-self:flex-start}
.ccard h3{font-size:15px;font-weight:800;margin:13px 0 8px;letter-spacing:-.015em;color:var(--tx)}
.ccard p{font-size:11.8px;line-height:1.55;color:var(--tx3)}
.ccard .foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ==================================================================== */
/*  END                                                                 */
/* ==================================================================== */
.endslide{justify-content:center;align-items:center;text-align:center}
.endslide h2{font-size:clamp(40px,7vw,96px);font-weight:900;letter-spacing:-.045em;
  line-height:.95;color:#fff}
.endslide h2 em{font-style:normal;color:var(--y)}
.endslide p{margin-top:18px;font-size:clamp(13px,1.3vw,17px);color:var(--tx3);max-width:62ch}
.endslide .ykey{margin-top:26px}
</style>
</head>
<body>

<div class="app" id="app" data-sec="cover">
  <div class="glow"></div>
  <div class="grid-tex"></div>

  <div class="stage">
    <div class="railwrap"><div class="rail" id="rail"></div></div>
  </div>

  <div class="botbar">
    <button class="navbtn" id="prev" title="Previous (←)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="posind" id="posind">1 / 1</span>
    <button class="navbtn" id="next" title="Next (→)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="botspacer"></div>
    <div class="secdrop" id="secdrop">
      <button class="secdrop-btn" id="secbtn" aria-haspopup="listbox" aria-expanded="false">
        <span class="cur" id="seccur">Cover</span>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <ul class="secdrop-list" id="seclist" role="listbox"></ul>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lbclose" id="lbclose" title="Close (Esc)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="lbstage" id="lbstage"></div>

/* monthly GMV as bars, with the phases that explain the shape drawn over the
   top — the chart is the argument, the tiles underneath are the receipts */
function bodyChart(p){
  const s = p.series || [], n = s.length;
  /* a second series needs its own axis, so the right margin opens up for it */
  const W = 1000, H = 300, L = 46, R = p.line ? 42 : 8, T = 18, B = 26;
  const pw = W - L - R, ph = H - T - B;
  const max = Math.max(...s.map(d=>d.v)) * 1.08;
  const step = pw / n, bw = Math.max(3, step * 0.62);
  const x = i => L + step * i + (step - bw) / 2;
  const y = v => T + ph - (v / max) * ph;

  /* percentages and dirhams want different axes and tooltips */
  const pct = p.fmt === 'pct';
  const val = v => pct ? v + '%' : 'AED ' + v + 'K';

  /* round the axis to a nice step, so the gridlines read as numbers not pixels */
  const NICE = [.5,1,2,5,10,25,50,100,250,500,1000,2500];
  const tick = NICE.find(t => max / t <= 6) || 5000;
  /* thousands stay in K — rounding 250 to "0.3M" would misstate the axis */
  const ylab = v => pct ? v + '%'
    : !v ? '0' : v < 1000 ? v + 'K' : (v/1000).toFixed(v % 1000 ? 1 : 0) + 'M';
  let axis = '';
  for (let v = 0; v <= max; v += tick){
    axis += `<line class="grid${v?'':' zero'}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>
      <text class="ylab" x="${L-9}" y="${y(v)+3}">${ylab(v)}</text>`;
  }

  const bars = s.map((d,i)=>
    `<rect class="bar${d.pre?' pre':''}${d.tone?' '+d.tone:''}" x="${x(i)}" y="${y(d.v)}" width="${bw}"
       height="${Math.max(1, T+ph-y(d.v))}" rx="1.5"><title>${esc(d.m)} — ${val(d.v)}</title></rect>`).join('');

  /* a label every nth bar, else the axis turns into a smear */
  const every = Math.ceil(n / 12);
  const xlabs = s.map((d,i)=> i % every ? '' :
    `<text class="xlab" x="${x(i)+bw/2}" y="${H-B+16}">${esc(d.m)}</text>`).join('');

  const bands = (p.bands||[]).map(b=>{
    const x1 = L + step * b.from, x2 = L + step * (b.to + 1);
    /* a band can stand on its own, so only label it when there is a label */
    return `<rect class="bandbox ${b.kind}" x="${x1}" y="${T}" width="${x2-x1}" height="${ph}" rx="4"/>`
      + (b.lab ? `<text class="bandlab ${b.kind}" x="${(x1+x2)/2}" y="${T-6}">${esc(b.lab)}</text>` : '');
  }).join('');

  const notes = (p.marks||[]).map(mk=>
    `<text class="peak" x="${x(mk.at)+bw/2}" y="${y(s[mk.at].v)-7}">${esc(mk.lab)}</text>`).join('');

  /* a run rate is a claim about a stretch of months, so draw it across
     exactly those months rather than the whole plot */
  const bases = (p.baselines||[]).map(b=>{
    const x1 = L + step * b.from, x2 = L + step * (b.to + 1), yv = y(b.v);
    return `<line class="base" x1="${x1+2}" x2="${x2-2}" y1="${yv}" y2="${yv}"/>
      <text class="baselab" x="${x1+5}" y="${yv-6}">${esc(b.lab)}</text>`;
  }).join('');

  /* the second series rides a right-hand axis of its own — gaps where a month
     has no reading, so the line never implies data that isn't there */
  let line = '';
  if (p.line){
    const lmax = p.lineMax || Math.max(...p.line.filter(v=>v!=null)) * 1.15;
    const yl = v => T + ph - (v / lmax) * ph;
    const runs = []; let cur = [];
    p.line.forEach((v,i)=>{
      if (v == null){ if (cur.length) runs.push(cur); cur = []; return; }
      cur.push(`${x(i)+bw/2},${yl(v)}`);
    });
    if (cur.length) runs.push(cur);
    line = runs.map(r=>`<polyline class="ln" points="${r.join(' ')}"/>`).join('')
      + p.line.map((v,i)=> v == null ? '' :
          `<circle class="lndot" cx="${x(i)+bw/2}" cy="${yl(v)}" r="2.6"><title>${esc(s[i].m)} — ${v}%</title></circle>`).join('');
    const ltick = NICE.find(t => lmax / t <= 5) || 10;
    for (let v = 0; v <= lmax; v += ltick)
      line += `<text class="ylab r" x="${W-R+9}" y="${yl(v)+3}">${v}%</text>`;
  }

  const funnel = p.funnel ? `<div class="chfn">
    <div class="bt">${esc(p.funnel.t || 'Uplift')}</div>
    <div class="rows">${p.funnel.rows.map(r=>{
      const top = Math.max(...p.funnel.rows.map(q=>q.v));
      return `<div class="row${r.v?'':' flat'}">
        <div class="lb">${esc(r.k)}<b>${r.v?'+'+r.v+'%':'flat'}</b></div>
        <div class="tr"><div class="fl" style="width:${top?Math.max(r.v/top*100,1.5):1.5}%"></div></div>
      </div>`;
    }).join('')}</div></div>` : '';

  return `<div class="chwrap">
    <div class="chrow">
      <div class="chplot">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
          ${bands}${axis}${bars}${bases}${notes}${line}${xlabs}
        </svg>
        ${(p.legend&&p.legend.length)||p.unit ? `<div class="chcap">
          ${(p.legend||[]).map(l=>`<span class="${l.kind}"><i></i>${esc(l.lab)}</span>`).join('')}
          ${p.unit?`<span style="margin-left:auto">${esc(p.unit)}</span>`:''}
        </div>` : ''}
      </div>
      ${funnel}
    </div>
    <div class="mgrid">${(p.metrics||[]).map(m=>`
      <div class="mtile">${m.k?`<span class="k">${esc(m.k)}</span>`:''}
        <div class="v">${esc(m.v)}</div>
        ${m.lab?`<div class="lab">${esc(m.lab)}</div>`:''}
        ${m.d?`<div class="dl${m.dir==='up'?' up':m.dir==='down'?' down':''}">${esc(m.d)}</div>`:''}
      </div>`).join('')}</div>
  </div>`;
}

const BODIES = { screens:bodyScreens, stack:bodyStack, columns:bodyColumns, beforeafter:bodyBeforeAfter, split:bodySplit, cards:bodyCards, metrics:bodyMetrics, chart:bodyChart };

function panelOf(p){
  const body = (BODIES[p.layout] || (()=>`<div class="ph" style="flex:1"><span class="t">Content</span>
    <span class="h">to be added</span></div>`))(p);
  return `<div class="panel" data-nm="${esc(p.title)}">
    <div class="pad col">${shead(p)}${body}</div>
    ${p.sticky ? `<div class="sticky"><b>Note</b>${esc(p.sticky)}</div>` : ''}</div>`;
}

function panelCover(){
  return `<div class="panel cover" data-nm="Cover">
    <div class="cover-in">
    <div class="t-top"><span class="t-pill"><i class="dotmark"></i>${esc(COVER.kicker)}</span></div>
    <h1>${esc(COVER.title[0])}<br><em>${esc(COVER.title[1])}</em></h1>
    <p class="lead">${esc(COVER.lead)}</p>
    <p class="sub">${esc(COVER.sub)}</p>
    </div>
    <img class="cover-art" src="assets/cover-cards.png" alt="">
  </div>`;
}

function panelEnd(){
  return `<div class="panel endslide" data-nm="End">
    <h2>${esc(END.title[0])} <em>${esc(END.title[1])}</em></h2>
    ${END.note ? `<p>${esc(END.note)}</p>` : ''}
    <span class="ykey"></span></div>`;
}

/* ====================================================================== */
/*  SHELL                                                                 */
/* ====================================================================== */
const rail = $('#rail');
const state = { sec:'cover' };
let panels = [], index = 0;

function render(){
  let html;
  if (state.sec === 'cover')    html = panelCover();
  else if (state.sec === 'end') html = panelEnd();
  else html = (PANELS[state.sec] || []).map(panelOf).join('')
             || `<div class="panel"><div class="pad col"><div class="ph" style="flex:1">
                  <span class="t">${esc(SEC_LABEL[state.sec])}</span>
                  <span class="h">no content yet</span></div></div></div>`;
  rail.innerHTML = html;
  $('#app').dataset.sec = state.sec;
  syncSecDrop();
  bindPanel();
  panels = $$('#rail > .panel');
  fitShots();
  requestAnimationFrame(fitShots);      /* again once fonts and layout settle */
  index = 0;
  rail.scrollTo({ left:0, behavior:'auto' });
  syncNav();
}

function bindPanel(){
  $$('#rail [data-goto]').forEach(b => b.onclick = () => go(b.dataset.goto));
  $$('#rail [data-lb]').forEach(el => el.onclick = e => {
    e.stopPropagation(); openLightbox(el.dataset.lb, el.dataset.cap);
  });
}

function go(sec){ state.sec = sec; render(); }

/* Size every screen to the room its cell actually has. A screen is capped
   by the height left above its caption and by the width of its column,
   whichever runs out first, so nothing is ever cut off by the slide edge —
   and because the frame ends up at the asset's own proportions, the border
   hugs the screen instead of floating around a letterboxed one. */
function fitShots(){
  /* clear what the last pass set, or each run would measure the room the
     previous run had already shrunk */
  $$('#rail .bashots').forEach(row => { row.style.height = ''; row.style.flexGrow = ''; });

  /* Columns hold different numbers of points, which would leave each screen
     below them a different amount of room. Hold every list in a row to the
     tallest, so the screens come out the same size. */
  $$('#rail .cols').forEach(row => {
    const lists = [...row.querySelectorAll('.colpts')];
    if (lists.length < 2) return;
    lists.forEach(l => { l.style.height = ''; });
    const tall = Math.max(...lists.map(l => l.offsetHeight));
    if (tall > 0) lists.forEach(l => { l.style.height = tall + 'px'; });
  });
  $$('#rail .shot').forEach(shot => {
    const fr = shot.querySelector('.fr');
    if (!fr) return;
    const media = fr.querySelector('img,video');
    const mw = media ? (media.naturalWidth  || media.videoWidth)  : 0;
    const mh = media ? (media.naturalHeight || media.videoHeight) : 0;
    const ar = (mw && mh) ? mw/mh : (shot.classList.contains('web') ? 16/10 : 9/19.5);
    const cap = shot.querySelector('.cap');
    const gap = parseFloat(getComputedStyle(shot).rowGap) || 0;
    const availH = shot.clientHeight - (cap ? cap.offsetHeight + gap : 0);
    const availW = shot.clientWidth;
    if (availH <= 0 || availW <= 0) return;
    const scale = parseFloat(getComputedStyle(shot).getPropertyValue('--scale')) || 1;
    const h = Math.min(availH * scale, availW / ar);
    const w = Math.floor(h * ar);
    fr.style.height = Math.floor(h) + 'px';
    fr.style.width  = w + 'px';
    /* a device's corner is a fixed share of its width, so the radius has to
       follow the size the screen ends up at */
    const flush = shot.classList.contains('colshot');
    const share = shot.classList.contains('web') ? .03 : flush ? .15 : .105;
    const rad = Math.round(w * share);
    /* a screen that runs to the foot of its box keeps its top corners only */
    const r = flush ? `${rad}px ${rad}px 0 0` : `${rad}px`;
    fr.style.borderRadius = r;
    /* the frame clips its contents, but a video is often composited on its
       own layer and ignores that clip — so it carries the corner too */
    if (media) media.style.borderRadius = r;
  });

  /* a before/after row is as tall as its tallest screen plus its captions,
     so the pair sits in the middle of the slide instead of at the foot of
     a row stretched to the full height */
  $$('#rail .bashots').forEach(row => {
    const shots = [...row.querySelectorAll('.shot')];
    if (!shots.length) return;
    const tall = Math.max(...shots.map(sh => {
      const fr = sh.querySelector('.fr'), cap = sh.querySelector('.cap');
      const gap = parseFloat(getComputedStyle(sh).rowGap) || 0;
      return (fr ? fr.offsetHeight : 0) + (cap ? cap.offsetHeight + gap : 0);
    }));
    if (tall > 0){ row.style.height = Math.ceil(tall) + 'px'; row.style.flexGrow = '0'; }
  });
}

let fitTick;
function fitSoon(){ cancelAnimationFrame(fitTick); fitTick = requestAnimationFrame(fitShots); }
/* an asset reports its size only once it has loaded, so refit on arrival */
document.addEventListener('load', e => { if (e.target.tagName === 'IMG') fitSoon(); }, true);
document.addEventListener('loadedmetadata', e => {
  if (e.target.tagName !== 'VIDEO') return;
  fitSoon();
  e.target.play().catch(()=>{});      /* autoplay is refused in a background tab */
}, true);

/* slides cut straight across — no tween, no animation on arrival */
function scrollToIndex(i){
  if (!panels.length) return;
  i = Math.max(0, Math.min(panels.length-1, i));
  index = i;
  rail.scrollTo({ left: panels[i].offsetLeft, behavior:'auto' });
  syncNav();
}

function step(n){
  const t = index + n, si = SEC_ORDER.indexOf(state.sec);
  if (t < 0){                                   /* off the front → previous section */
    if (si > 0){ go(SEC_ORDER[si-1]); scrollToIndex(panels.length-1); }
    return;
  }
  if (t > panels.length-1){                     /* off the end → next section */
    if (si < SEC_ORDER.length-1) go(SEC_ORDER[si+1]);
    return;
  }
  scrollToIndex(t);
}
function currentIndex(){
  if (!panels.length) return 0;
  const mid = rail.scrollLeft + rail.clientWidth/2;
  let best = 0, bd = Infinity;
  panels.forEach((el,i)=>{ const d = Math.abs(el.offsetLeft+el.offsetWidth/2-mid); if (d<bd){ bd=d; best=i; } });
  return best;
}
/* The counter used to number a slide within its own chapter, so a three
   slide chapter read "3 / 3" halfway through the deck. Count across the
   whole deck instead. */
function slideCounts(){
  return SEC_ORDER.map(id => (PANELS[id] || []).length || 1);
}
function slideTotal(){ return slideCounts().reduce((a,b)=>a+b, 0); }
function slideNo(){
  const si = SEC_ORDER.indexOf(state.sec);
  return slideCounts().slice(0, si).reduce((a,b)=>a+b, 0) + index + 1;
}

function syncNav(){
  const n = panels.length, si = SEC_ORDER.indexOf(state.sec);
  index = Math.max(0, Math.min(n-1, index));
  $('#prev').disabled = (index===0 && si===0);
  $('#next').disabled = (index===n-1 && si===SEC_ORDER.length-1);
  $('#posind').textContent = `${slideNo()} / ${slideTotal()}`;

}

let scrollTick;
rail.addEventListener('scroll', ()=>{
  clearTimeout(scrollTick);
  scrollTick = setTimeout(()=>{ index = currentIndex(); syncNav(); }, 60);
});

let wheelLock = 0;
rail.addEventListener('wheel', e=>{
  /* a scrollable region owns its own wheel — the deck stays put */
  if (e.target.closest && e.target.closest('.vscroll')) return;
  const dd = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (!dd || panels.length < 2) return;
  e.preventDefault();
  const now = Date.now();
  if (now - wheelLock < 420) return;
  wheelLock = now;
  const t = index + (dd>0 ? 1 : -1);
  if (t >= 0 && t <= panels.length-1) scrollToIndex(t);
}, { passive:false });

let drag = null;
rail.addEventListener('pointerdown', e=>{
  if (e.target.closest('.vscroll, button, a, input, select')) return;
  drag = { x:e.clientX, left:rail.scrollLeft, moved:false };
  rail.classList.add('grabbing');
});
rail.addEventListener('pointermove', e=>{
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (Math.abs(dx) > 3) drag.moved = true;
  rail.scrollLeft = drag.left - dx;
});
function endDrag(){
  if (!drag) return;
  const moved = drag.moved; drag = null;
  rail.classList.remove('grabbing');
  if (moved) scrollToIndex(currentIndex());
}
['pointerup','pointercancel','pointerleave'].forEach(ev=>rail.addEventListener(ev,endDrag));
rail.addEventListener('click', e=>{ if (drag && drag.moved) e.preventDefault(); }, true);

document.addEventListener('keydown', e=>{
  if ($('#lightbox').classList.contains('on')){
    if (e.key==='Escape' || e.key==='Enter' || e.key===' '){ e.preventDefault(); closeLightbox(); }
    else if (e.key.startsWith('Arrow')) e.preventDefault();
    return;
  }
  switch(e.key){
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': e.preventDefault(); step(1); break;
    case 'ArrowLeft':  case 'ArrowUp':   case 'PageUp':   e.preventDefault(); step(-1); break;
    case 'Home': e.preventDefault(); go('cover'); break;
    case 'End':  e.preventDefault(); go('end'); break;
    case 'Escape': if ($('#secdrop').classList.contains('open')) closeSecDrop(); break;
  }
});
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);

/* ---- lightbox ---- */
function openLightbox(src, caption){
  $('#lbstage').innerHTML = isVid(src)
    ? `<video src="${src}" autoplay loop muted playsinline controls></video>`
    : `<img src="${src}" alt="">`;
  $('#lbcap').textContent = caption || '';
  $('#lightbox').classList.add('on');
}
function closeLightbox(){
  $('#lightbox').classList.remove('on');
  $('#lbstage').innerHTML = '';        /* stops a video that was playing */
}
$('#lightbox').onclick = e => { if (!e.target.closest('video')) closeLightbox(); };
$('#lbclose').onclick = e => { e.stopPropagation(); closeLightbox(); };

/* ---- section dropdown ---- */
function buildSecDrop(){
  $('#seclist').innerHTML = SEC_ORDER.map((k,i)=>
    `<li role="option" data-sec="${k}" aria-selected="${k===state.sec}">
       <span class="n">${String(i).padStart(2,'0')}</span>${SEC_LABEL[k]}</li>`).join('');
  $$('#seclist li').forEach(li => li.onclick = () => { closeSecDrop(); go(li.dataset.sec); });
}
function openSecDrop(){ $('#secdrop').classList.add('open'); $('#secbtn').setAttribute('aria-expanded','true'); }
function closeSecDrop(){ $('#secdrop').classList.remove('open'); $('#secbtn').setAttribute('aria-expanded','false'); }
$('#secbtn').onclick = e => {
  e.stopPropagation();
  $('#secdrop').classList.contains('open') ? closeSecDrop() : openSecDrop();
};
document.addEventListener('click', e => { if (!e.target.closest('#secdrop')) closeSecDrop(); });
function syncSecDrop(){
  const onCover = state.sec === 'cover';
  $('#secdrop').classList.toggle('hidden', onCover);
  if (onCover) closeSecDrop();
  $('#seccur').textContent = SEC_LABEL[state.sec] || state.sec;
  $$('#seclist li').forEach(li => li.setAttribute('aria-selected', li.dataset.sec===state.sec));
}

let rz;
window.addEventListener('resize', ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ fitShots(); syncNav(); }, 90); });
window.addEventListener('load', ()=>{ fitShots(); syncNav(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitShots);

buildSecDrop();
(function(){
  const h = (location.hash||'').replace('#','');
  go(SEC_ORDER.includes(h) ? h : 'cover');
})();
</script>
</body>
</html>
